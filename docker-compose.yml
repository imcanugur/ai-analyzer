services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ai-analyzer_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        env_file:
            - .env
        environment:
            CONTAINER_ROLE: app
        networks:
            - npm_default

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ai-analyzer_scheduler
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        command: php artisan schedule:work
        env_file:
            - .env
        environment:
            CONTAINER_ROLE: scheduler
        depends_on:
            - app
        networks:
            - npm_default

    horizon:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ai-analyzer_horizon
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        command: php artisan horizon
        env_file:
            - .env
        environment:
            CONTAINER_ROLE: horizon
        depends_on:
            - app
        networks:
            - npm_default

    nginx:
        image: nginx:alpine
        container_name: ai-analyzer_nginx
        restart: unless-stopped
        volumes:
            - ./:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ./logs/nginx:/var/log/nginx
        ports:
            - "${PORT:-8080}:80"
        depends_on:
            - app
        networks:
            - npm_default

networks:
    npm_default:
        external: true
