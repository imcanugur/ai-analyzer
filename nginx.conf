server {
    listen 80;
    server_name ai-analyzer.local;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 100M;

    # Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass ai-analyzer_app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;
        fastcgi_param HTTP_CF_CONNECTING_IP  $http_cf_connecting_ip;

        fastcgi_connect_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_read_timeout 600;
    }

    # Static Assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff|woff2|ttf|eot|otf|xml|map)$ {
        access_log off;
        log_not_found off;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # robots
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Hidden files (.env, .git, .idea, vb.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;
}
